version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/plugins/opencode/v2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # these release in lockstep and pin each other exactly; separate bumps leave two copies in the lockfile
      opencode:
        patterns:
          - "@opencode/*"
